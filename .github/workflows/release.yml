name: Release

# Push a vX.Y.Z tag matching pyproject.toml: checks the version, tests, publishes to PyPI with trusted publishing and
# creates the GitHub Release. Safe to re-run (existing files and releases are skipped).
#
# PyPI trusted publisher (pypi.org → project `pitchmentor` → Publishing, or a "pending publisher" before the first upload):
#   owner: pitchmentor   repository: pitchmentor-python   workflow: release.yml   environment: pypi
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: pip install -e '.[dev]' build twine
      - run: mypy
      - run: python -m unittest discover -s tests
      - run: python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pitchmentor
    permissions:
      id-token: write # trusted publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME already exists"; exit 0; fi
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Published to PyPI: [\`pitchmentor $v\`](https://pypi.org/project/pitchmentor/$v/) (\`pip install pitchmentor==$v\`)."

name: Regen

# Weekly: regenerate src/pitchmentor/_generated.py from the live OpenAPI spec and open a PR if it changed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    uses: pitchmentor/.github/.github/workflows/regen.yml@a6abeaf7d14428db807abd67280d834aab7aaae3 # v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      language: python
      check: pip install -e '.[dev]' && mypy && python -m unittest discover -s tests

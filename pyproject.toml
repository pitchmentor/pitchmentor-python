[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchmentor"
version = "0.1.0"
description = "Python SDK for the Pitch Mentor API."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "types-requests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitchmentor = ["py.typed"]

[tool.mypy]
strict = true
files = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchmentor"
version = "0.1.0"
description = "Official Python SDK for the Pitch Mentor API (real-time AI sales coaching)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pitch Mentor" }]
keywords = ["pitchmentor", "pitch-mentor", "sales-coaching", "api", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31.0"]

[project.urls]
Homepage = "https://pitchmentor.net"
Documentation = "https://pitchmentor.net/docs"
Repository = "https://github.com/pitchmentor/sdk"
Issues = "https://github.com/pitchmentor/sdk/issues"

[project.optional-dependencies]
dev = ["mypy>=1.10", "types-requests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitchmentor = ["py.typed"]

[tool.mypy]
strict = true
files = ["src"]
